[project]
name = "propscout"
version = "0.1.0"
description = "Self-hostable real estate opportunity finder: scrapers + cheap LLM research agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "homeharvest>=0.8.18",
  "pandas>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "openai>=1.40",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
propscout = "propscout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propscout"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # B008: typer defaults; E501: formatter owns line length
